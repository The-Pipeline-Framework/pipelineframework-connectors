name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_external_it:
        description: Run the external-service integration-test lane
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-path: ${{ github.workspace }}/.m2/repository
      - name: Verify
        run: ./mvnw -B -V -Dmaven.repo.local="$PWD/.m2/repository" clean verify -DskipITs -Dgpg.skip
      - name: Verify publication contract
        run: |
          node --test scripts/verify-ci-workflow.test.mjs scripts/verify-connector-publication.test.mjs
          ./mvnw -Pcentral-publishing -q -DskipTests help:effective-pom -Doutput=target/connectors-effective-pom.xml -Dmaven.repo.local="$PWD/.m2/repository"
          node scripts/verify-connector-publication.mjs target/connectors-effective-pom.xml

  external-integration-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.run_external_it
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run external-service integration tests
        run: ./mvnw -B -V -Dmaven.repo.local="$PWD/.m2/repository" clean verify -Dgpg.skip
