name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: ./mvnw -B -V -Dmaven.repo.local="$PWD/.m2/repository" clean verify -DskipTests -Dgpg.skip
      - name: Verify publication contract
        run: |
          node --test scripts/verify-connector-publication.test.mjs
          ./mvnw -Pcentral-publishing -q -DskipTests help:effective-pom -Doutput=target/connectors-effective-pom.xml -Dmaven.repo.local="$PWD/.m2/repository"
          node scripts/verify-connector-publication.mjs target/connectors-effective-pom.xml
